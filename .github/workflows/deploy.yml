name: Deploy no GitHub Pages

# Publica o site sempre que houver push na branch main.
# Também pode ser disparado manualmente na aba "Actions".
on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissões que o job precisa para publicar no Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Garante que só um deploy rode por vez (sem cancelar o que já começou).
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 1. Baixa o código do repositório
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Prepara o ambiente do GitHub Pages
      - name: Configurar Pages
        uses: actions/configure-pages@v5

      # 3. Empacota o site (site estático: publica a pasta inteira)
      - name: Empacotar arquivos do site
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      # 4. Publica no GitHub Pages
      - name: Publicar no Pages
        id: deployment
        uses: actions/deploy-pages@v4
